name: cathoot

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      # WEB_PORT=0: porta aleatória (usado no Jenkins)
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
