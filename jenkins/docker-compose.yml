# Incluído pelo docker-compose.yml da raiz. O perfil "jenkins" é ligado por COMPOSE_PROFILES no .env
# da raiz; sem ele (ex.: dentro do próprio Jenkins) este serviço é ignorado.
services:
  jenkins:
    build: .
    image: cathoot-jenkins
    profiles: ["jenkins"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    # GID do dono do socket do Docker (0 no Mac; no Linux, o do grupo docker; defina DOCKER_GID no .env da raiz)
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./casc.yaml:/var/jenkins_conf/casc.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
